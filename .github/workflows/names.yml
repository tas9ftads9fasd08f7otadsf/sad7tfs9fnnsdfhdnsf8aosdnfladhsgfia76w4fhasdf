name: Map · names

# GEOGRAPHICAL NAMES from OSM into their own `.pmtiles`: cities, villages,
# settlements, mountains, valleys, plains and regions (see the
# `workers/names/names.yml` header). It's the `names` package.
#
# The same pattern as history: the same PBF read again with its own schema.
on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – it names `{region}-names.pmtiles`"
        required: true
        type: string
      region_bbox:
        description: "Region bbox for clipping tiles (workers/lib/region-clip.sh)"
        required: true
        type: string
      maxzoom:
        description: "Highest zoom of the geographical names tiles"
        required: false
        default: "14"
        type: string
      region_clip:
        description: "Clip tiles to the region border"
        required: false
        default: "false"
        type: string
      size_limit_mb:
        description: "The whole page budget in MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "Geographical names' share of the page budget in percent"
        required: false
        default: "3"
        type: string
      day:
        description: "Date for the Planetiler cache key"
        required: false
        default: ""
        type: string
    outputs:
      enabled:
        description: "Was the layer made? (a cutout may hold none of it)"
        value: ${{ jobs.names.outputs.enabled }}
      maxzoom:
        description: "The zoom tiles really go up to"
        value: ${{ jobs.names.outputs.maxzoom }}
      size_mb:
        description: "Layer size in MB"
        value: ${{ jobs.names.outputs.size_mb }}
    # `workflow_call` doesn't inherit secrets; without them the Drive cache can't
    # open and Planetiler (93 MB) is downloaded on every run.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# Drive sign-in for the whole workflow, not per step: cache-restore and
# cache-save are two steps, and with the token on only one of them the other
# would quietly go back to downloading everything. Guarded by “Check · workflow lint”.
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

jobs:
  names:
    name: Geographical names
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.names.outputs.enabled }}
      maxzoom: ${{ steps.names.outputs.maxzoom }}
      size_mb: ${{ steps.names.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the plan
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # the region polygon is Planetiler's `--polygon`; `continue-on-error`, since
      # the run finishes without it too (tiles then follow the bbox)
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          store: github
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          store: github
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # schema tests before the build (`examples`) – the one thing that tells the
      # truth about a schema without a whole run. They go first.
      - name: Geographical names schema tests
        run: |
          mkdir -p data
          workers/lib/name-languages.sh workers/names/names.yml data/names.yml
          workers/lib/verify-schema.sh data/names.yml

      # described in `workers/names/build.sh`
      - name: Geographical names from OSM → PMTiles
        id: names
        env:
          OPT_NAMES_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_REGION_CLIP: ${{ inputs.region_clip }}
          REGION_BBOX: ${{ inputs.region_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_NAMES_PCT: ${{ inputs.budget_pct }}
        run: workers/names/build.sh

      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-names
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-names
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
