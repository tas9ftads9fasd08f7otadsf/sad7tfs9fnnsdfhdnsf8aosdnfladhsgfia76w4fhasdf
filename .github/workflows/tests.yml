name: Check · tests

# worker code run on small hand-built input, before a two-hour region build does

on:
  push:
    paths:
      - "workers/**"
      - "config/**"
      - "poc/web/**"
      - ".github/workflows/tests.yml"
  # every PR, whatever it touches
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Code or docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files="" ;;
            push) files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files="" ;;
            *) files="" ;;
          esac
          # an unknown change counts as code; compare lists at most 300 files
          if [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] && ! grep -qvE '\.md$' <<< "$files"; then
            echo "::notice::only docs changed, so no tests run"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: unit (stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        run: python3 -m unittest discover -s workers/tests -v
      - name: JavaScript
        run: node --test workers/tests/*.test.mjs

  unit-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: unit (with dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # a skipped test verifies nothing
      TESTS_REQUIRE_ALL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # what the build scripts install
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin osmium-tool librsvg2-bin >/dev/null
          python3 -m pip install --quiet --break-system-packages \
            'osmium>=3.6,<5' numpy pillow pmtiles mapbox-vector-tile shapely \
            mwparserfromhell coverage
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/npm" \
            @maplibre/maplibre-gl-style-spec@23.3.0
      - name: Python
        run: |
          set -euo pipefail
          python3 -m coverage run --source=workers --omit='workers/tests/*' \
            -m unittest discover -s workers/tests -v
          {
            echo "### Python coverage"
            python3 -m coverage report --format=markdown --skip-empty --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"
      - name: JavaScript
        env:
          STYLE_SPEC_DIR: ${{ runner.temp }}/npm
        run: node --test --experimental-test-coverage workers/tests/*.test.mjs
