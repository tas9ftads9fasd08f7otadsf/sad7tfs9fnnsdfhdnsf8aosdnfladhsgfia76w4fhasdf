name: Map · Regenerate state

# ONE LAYER ACROSS A COUNTRY IN ONE CLICK: over every region it runs
# “Regenerate region layer” for the one thing you pick.
#
# The choices are `workers/state/jobs.py`. `points`, `roads`, `paths`, `boundaries`
# and `water` take minutes per region (the same PBF as the map; `roads` carry the
# routing network too); `contours`, `rocks` and `terrain` tens of minutes to hours.
#
# A relay like “Build map state”: a job has a six-hour cap. The core is
# `workers/state/relay-core.sh`, the rest `regenerate.sh`. Only that one package
# is overwritten on Drive and the `maps.json` entry is added to.

on:
  workflow_dispatch:
    inputs:
      # the list is workers/data/regions.json (the workflow lint guards it)
      country:
        description: "Country – regenerated in every region of it"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
          - cesko
          - rakusko
      # the list is `workers/state/jobs.py`; cheapest first
      what:
        description: "What to regenerate in every region"
        required: true
        default: points
        type: choice
        options:
          - points
          - roads
          - paths
          - boundaries
          - water
          - railways
          - history
          - settlements
          - contours
          - rocks
          - terrain
      test:
        description: "Quick test: every region only on 4 km² in its middle (a batch trial)"
        required: false
        default: false
        type: boolean
      # the relay baton, not a field for people
      continuation:
        description: "Leave empty – the relay baton, the batch passes it itself"
        required: false
        default: ""
        type: string

# `actions: write` is all this workflow does: it dispatches other runs
permissions:
  contents: read
  actions: write

# no `concurrency` on purpose, as in “Build map state”

jobs:
  relay:
    name: Relay leg
    runs-on: ubuntu-latest
    # under the six-hour cap – waiting for a region is capped at 5 h
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # the country's own; each region run prints the region's
      - name: Settings of the country (map-settings.json)
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          WORKFLOW: .github/workflows/regenerate-state.yml
          OPT_REGION: ${{ inputs.country }}
          OPT_TEST: ${{ inputs.test }}
        run: workers/plan/settings.sh
      - name: Wait for the region, start the next and hand over the relay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          COUNTRY: ${{ inputs.country }}
          WHAT: ${{ inputs.what }}
          CONTINUATION: ${{ inputs.continuation }}
          TEST: ${{ inputs.test }}
        run: workers/state/regenerate.sh
