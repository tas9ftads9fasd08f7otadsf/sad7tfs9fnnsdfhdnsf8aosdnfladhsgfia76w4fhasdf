name: Restore cache from Google Drive
description: >-
  Stand-in for actions/cache/restore. Entries live on Drive, not on GitHub –
  which gives a repository 10 GB and quietly dropped the oldest – except small
  ones many jobs restore, which ask for `store: github`.

# Inputs and outputs MATCH `actions/cache/restore`, so the `if:` conditions in
# workflows needn't change and what's written about them holds: `cache-hit` is
# `true` only on an exact key match, `restore-keys` are prefixes and the newest
# matching entry wins.
#
# SIGN-IN ISN'T AN INPUT, it comes from the job's environment
# (GDRIVE_CREDENTIALS or the DRIVE_CLIENT/DRIVE_SECRET/DRIVE_REFRESH trio).
# A composite action sees the calling job's `env:`, not `secrets` – and a token
# passed as an input would sit in each of twenty calls. That the job really has
# it is guarded by “Check · workflow lint”.

inputs:
  path:
    description: "What is restored – one path per line, as with actions/cache"
    required: true
  key:
    description: "Entry key"
    required: true
  restore-keys:
    description: "Prefixes searched when the key misses (one per line)"
    required: false
    default: ""
  store:
    description: "`drive`, or `github` for small entries restored by many jobs (kept ~7 days)"
    required: false
    default: drive

outputs:
  cache-hit:
    description: "`true` only on an EXACT key match"
    value: ${{ steps.github.outputs.cache-hit || steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: "The key searched for (to save under the same key)"
    value: ${{ steps.github.outputs.cache-primary-key || steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: "The key actually found (differs on a prefix match)"
    value: ${{ steps.github.outputs.cache-matched-key || steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # a dozen jobs restoring one jar spent Drive's per-minute quota (runs 42365913724…)
    - id: github
      if: ${{ inputs.store == 'github' }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}

    - id: restore
      if: ${{ inputs.store != 'github' }}
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
        CACHE_PATH: ${{ inputs.path }}
        CACHE_RESTORE_KEYS: ${{ inputs.restore-keys }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/workers/drive/cache.py" --restore \
          --key="$CACHE_KEY" \
          --path="$CACHE_PATH" \
          --restore-keys="$CACHE_RESTORE_KEYS"
