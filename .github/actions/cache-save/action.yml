name: Save cache to Google Drive
description: >-
  Stand-in for actions/cache/save. It saves as soon as the data exists, not in
  a post step – so a cancelled run doesn't throw finished work away.

# THE SAME SEMANTICS AS GITHUB: an existing key is NOT OVERWRITTEN. So keys meant
# to be topped up (the slope part store, shading tiles) carry `github.run_id`
# and are found through `restore-keys`.
#
# When saving fails the step FAILS – callers have `continue-on-error`, so the run
# goes on, but the log shows red. A cache that quietly isn't saved costs the next
# run hours of compute and shows nowhere else.

inputs:
  path:
    description: "What is saved – one path per line, as with actions/cache"
    required: true
  key:
    description: "Entry key"
    required: true
  store:
    description: "`drive`, or `github` – the same as at restore"
    required: false
    default: drive

runs:
  using: composite
  steps:
    - id: github
      if: ${{ inputs.store == 'github' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - id: save
      if: ${{ inputs.store != 'github' }}
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
        CACHE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/workers/drive/cache.py" --save \
          --key="$CACHE_KEY" \
          --path="$CACHE_PATH"
