# Planetiler custom schema – landscape points from OSM, own archive for its own package.
# Same input and prefilter as `features.yml`; `centroid` since a cave is a node, a tower an area.
schema_name: FricoMaps landscape points
schema_description: >-
  Caves, waterfalls, lookout towers, huts and survey points – OSM point features
  the OpenMapTiles schema doesn't carry; springs are Water's, monuments and mines Army & history's
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

# a region's build puts them past its maxzoom: its Landscape draws peaks and saddles already
args:
  peak_minzoom:
    description: zoom a range's peaks start at
    default: 10
  saddle_minzoom:
    description: zoom a range's saddles start at
    default: 12

sources:
  osm:
    type: osm
    local_path: data/features.osm.pbf

# elevation must be a number in the tile; one that doesn't parse drops out
tag_mappings:
  ele: double

layers:
  - id: feature_point
    features:
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          waterway: waterfall
        attributes:
          - key: name
          - key: ele
          - key: class
            value: waterfall

      # --- kras ---
      - source: osm
        geometry: centroid
        min_zoom: 12
        include_when:
          natural: cave_entrance
        attributes:
          - key: name
          - key: ele
          - key: class
            value: cave_entrance
      - source: osm
        geometry: centroid
        min_zoom: 14
        include_when:
          natural: sinkhole
        attributes:
          - key: name
          - key: class
            value: sinkhole

      # towers and masts: OpenMapTiles knows `man_made=tower` only with `tourism=viewpoint`
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          man_made: tower
        attributes:
          - key: name
          - key: ele
          - key: class
            value: tower
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
          # `observation` = lookout tower; the style draws it unlike a transmitter
          - key: subclass
            value:
              tag_value: "tower:type"
      - source: osm
        geometry: centroid
        min_zoom: 13
        include_when:
          man_made: [mast, water_tower, chimney]
        attributes:
          - key: name
          - key: class
            type: match_value

      # hut: `wilderness_hut` isn't in OpenMapTiles, yet it's the hut a route is planned around
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          tourism: wilderness_hut
        attributes:
          - key: name
          - key: ele
          - key: class
            value: wilderness_hut

      # mountain pass
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          mountain_pass: yes
        attributes:
          - key: name
          - key: ele
          - key: class
            value: mountain_pass

      # emergency point: the number reported to mountain rescue
      - source: osm
        geometry: centroid
        min_zoom: 14
        include_when:
          highway: emergency_access_point
        attributes:
          - key: name
          - key: ref
          - key: class
            value: emergency_access_point

      # survey point
      - source: osm
        geometry: centroid
        min_zoom: 15
        include_when:
          man_made: survey_point
        attributes:
          - key: name
          - key: ele
          - key: class
            value: survey_point
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

  # a range's peaks and saddles: a region's base map has them in `mountain_peak`, a range has no base map
  - id: peak
    features:
      - source: osm
        geometry: centroid
        min_zoom: ${ args.peak_minzoom }
        include_when:
          natural: [peak, volcano]
        attributes:
          - key: name
          - key: ele
          - key: class
            value: peak
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
      - source: osm
        geometry: centroid
        min_zoom: ${ args.saddle_minzoom }
        include_when:
          natural: saddle
        attributes:
          - key: name
          - key: ele
          - key: class
            value: saddle
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

# TESTS: `java -jar planetiler.jar verify workers/features/points.yml`
examples:
  - name: A peak is named with its height from z10
    input:
      source: osm
      geometry: point
      tags:
        natural: peak
        name: Gerlachovský štít
        ele: '2655'
    output:
      - layer: peak
        geometry: point
        min_zoom: 10
        tags:
          class: peak
          name: Gerlachovský štít
          ele: 2655.0

  - name: A saddle is a point from z12
    input:
      source: osm
      geometry: point
      tags:
        natural: saddle
        name: Priečne sedlo
    output:
      - layer: peak
        geometry: point
        min_zoom: 12
        tags:
          class: saddle
          name: Priečne sedlo

