# Planetiler custom schema – marked trails (hiking, cycling, ski, horse).
# Input from `workers/trails/routes.py`: one line per route per way, in its lane.
schema_name: FricoMaps marked trails
schema_description: Hiking paths, cycle routes, ski and horse trails from OSM relations
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

args:
  # `trails_local_minzoom` in the map settings; Mapy.com shows them from its z12
  local_minzoom:
    description: zoom local routes start at
    default: 11

sources:
  trails:
    type: geojson
    local_path: data/trails.geojson

layers:
  - id: trail
    features:
      # long-distance routes (E-paths, national trails) show from afar
      - source: trails
        geometry: line
        min_zoom: 8
        include_when:
          tier:
            - international
            - national
        attributes: &trail_attributes
          # route kind – the style picks colour, width and icon by it
          - key: route
          # named mark colour (red, blue, …) → recolourable by palette
          - key: colour
          # raw OSM hex when the colour is none of the named ones
          - key: hex
          # the mark as painted: the style builds `mark-<mark_bg>-<mark_fg>-<mark>`
          - key: mark
          - key: mark_bg
          - key: mark_fg
          - key: network
          - key: tier
          - key: name
          - key: ref
          # lane: side (+1 walking, −1 wheeled), order on that side, routes on the way
          - key: side
            type: integer
          - key: off
            type: double
          # the lane shared by routes of one colour, for `trails.lanes: colour`
          - key: lane
            type: double
          - key: cnt
            type: integer
          # what it runs on – `path` or `road`
          - key: way
          # relation id, to look the route up in OSM
          - key: rel
            type: long

      # regional marking – most hiking routes
      - source: trails
        geometry: line
        min_zoom: 10
        include_when:
          tier: regional
        attributes: *trail_attributes

      # local loops and nature trails, most of the marked length in the mountains
      - source: trails
        geometry: line
        min_zoom: ${ args.local_minzoom }
        include_when:
          tier: local
        attributes: *trail_attributes

    # merged so a name along the line fits
    tile_post_process:
      merge_line_strings:
        min_length: 0

  # one line per route without the lane attributes, which break `trail` into pieces at
  # every junction; the names ride on it
  - id: trail_name
    features:
      - source: trails
        geometry: line
        min_zoom: 12
        include_when:
          __any__:
            - name: __any__
            - ref: __any__
        attributes:
          - key: route
          - key: colour
          - key: hex
          - key: tier
          - key: name
          - key: ref
          - key: rel
            type: long
    tile_post_process:
      merge_line_strings:
        min_length: 0

examples:
  - name: A trail's name rides on a line without lane attributes
    input:
      source: trails
      geometry: line
      tags:
        route: hiking
        colour: red
        tier: national
        name: Tatranská magistrála
        ref: "0930"
        rel: 1208354
        side: 1
        off: 1
        lane: 1
        cnt: 2
        way: path
    output:
      - layer: trail
        geometry: line
        min_zoom: 8
        allow_extra_tags: true
        tags:
          name: Tatranská magistrála
      - layer: trail_name
        geometry: line
        min_zoom: 12
        allow_extra_tags: false
        tags:
          route: hiking
          colour: red
          tier: national
          name: Tatranská magistrála
          ref: "0930"
          rel: 1208354

  - name: A route with neither name nor number has no label line
    input:
      source: trails
      geometry: line
      tags:
        route: hiking
        colour: blue
        tier: regional
        side: 1
    output:
      - layer: trail
        geometry: line
        allow_extra_tags: true
